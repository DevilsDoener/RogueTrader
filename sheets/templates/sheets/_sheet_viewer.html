{% load static sheets_extras %}
{% for page in pages %}
  <section class="sheet-page" data-page-id="{{ page.page_id }}">
    <div class="sheet-page-canvas" style="position: relative; width: 100%; max-width: {{ page.width }}px;">
      <img src="{{ page.image_url }}" alt="{{ page.page_id }}" style="width: 100%; display: block;">
      {% for field in page.fields %}
        <div
          class="sheet-field"
          style="position: absolute; left: {{ field.x }}%; top: {{ field.y }}%; width: {{ field.width }}%; height: {{ field.height }}%;"
        >
          {% if field.kind == "checkbox" %}
            <input
              type="checkbox"
              name="{{ field.id }}"
              aria-label="{{ field.label }}"
              disabled
              {% if character.values|get_item:field.id %}checked{% endif %}
            >
          {% else %}
            <input
              type="text"
              name="{{ field.id }}"
              aria-label="{{ field.label }}"
              value="{{ character.values|get_item:field.id|default_if_none:'' }}"
              maxlength="{{ field.max_length }}"
              disabled
            >
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </section>
{% endfor %}
