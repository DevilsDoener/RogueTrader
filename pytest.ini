[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts = -p no:cacheprovider --strict-markers
norecursedirs = .* tmp staticfiles graphify-out pytest-of-* pytest-cache-files-*
# Set automatically by tests/e2e/conftest.py. Quick run while working:
#   pytest -m "not e2e"
# The full suite (no -m) stays mandatory before build, push and completion.
markers =
    e2e: Playwright browser test against the live server (tests/e2e)
    visual: screenshot comparison against tests/visual (subset of e2e)
