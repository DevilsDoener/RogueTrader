# Ruff is used as a linter only. The codebase is deliberately not reflowed, so
# `ruff format` is not part of the workflow -- run `ruff check .`.
target-version = "py312"
line-length = 100

extend-exclude = [
    ".venv",
    ".worktrees",
    "graphify-out",   # generated by the knowledge-graph tooling
    "tmp",            # git-ignored scratch space
    "content",        # rules-corpus Markdown, no Python
    "staticfiles",    # collectstatic output
    "backups",
    "data",
    "pytest-of-*",
    "pytest-cache-files-*",
]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade (to py312)
    "SIM",      # flake8-simplify
    "DJ",       # flake8-django
    "S",        # flake8-bandit
    "BLE",      # blind `except Exception` needs a stated reason
    "PTH",      # prefer pathlib
    "RUF100",   # a `noqa` that no longer suppresses anything
]

[lint.per-file-ignores]
# Applied migrations are frozen history: never reformatted or "modernised".
"**/migrations/*.py" = ["E501", "E701", "E702", "I001", "UP"]
# Tests assert by design, and use throwaway credentials against the test DB.
"**/tests/**" = ["S101", "S105", "S106", "S107"]
"tests/**" = ["S101", "S105", "S106", "S107"]
"conftest.py" = ["S101", "S105"]
# The `endpoint` fixture is imported from the contract module on purpose, so
# that pytest applies it here; ruff reads every use as a redefinition.
"sheets/tests/test_field_endpoint_hardening.py" = ["F811"]

[lint.isort]
known-first-party = ["accounts", "config", "core", "sheets", "wiki", "tools"]
combine-as-imports = true
