{% extends "base.html" %}

{% block title %}Anmelden &ndash; Rogue Trader Portal{% endblock %}

{% block bare_content %}
  <div class="auth-card">
    <h1>Anmelden</h1>
    <form method="post">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      {{ form.non_field_errors }}
      {{ form.as_p }}
      <button type="submit" class="button-primary">Anmelden</button>
    </form>
  </div>
{% endblock %}
