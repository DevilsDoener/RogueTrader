name: Security audit

# Manual only: the weekly schedule (Mondays, 05:17 UTC) was switched off to
# stop the failure e-mails. Run it from the Actions tab when wanted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Installed in this job only; it is not a project dependency.
      - name: Install pip-audit
        run: pip install pip-audit

      # Any known vulnerability in a locked package fails the run. The locks
      # carry hashes, so pip-audit checks them as pinned, without resolving.
      - name: Audit runtime dependencies
        run: pip-audit --requirement requirements.txt --require-hashes --disable-pip

      - name: Audit development dependencies
        run: pip-audit --requirement requirements-dev.txt --require-hashes --disable-pip
