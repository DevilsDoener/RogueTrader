services:
  portal:
    build: .
    image: rogue-trader-portal
    restart: unless-stopped
    # Container hardening: no privilege gain, no Linux capabilities (gunicorn
    # on port 8000 and sqlite need none), and a read-only root filesystem. The
    # only writable places are the mounted volumes and a tmpfs /tmp (gunicorn's
    # worker heartbeat files).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      DATABASE_PATH: /data/db.sqlite3
      WIKI_CONTENT_ROOT: /content/wiki
      # Default chapter list and order come from wiki/manifest.py; this only
      # passes through an explicit override.
      WIKI_CONTENT_ALLOWLIST: ${WIKI_CONTENT_ALLOWLIST:-}
      WIKI_STRICT_CONTENT: ${WIKI_STRICT_CONTENT:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      # No fallback here on purpose: config/settings.py hard-fails startup
      # when this is absent under DJANGO_DEBUG=false. A default here would
      # silently defeat that check for the docker compose deployment path.
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      ENABLE_HSTS: ${ENABLE_HSTS:-0}
    volumes:
      - portal-data:/data
      # Only the wiki's Markdown chapters are mounted -- never the whole
      # repository checkout. Mounting "./" here would also expose .env
      # (DJANGO_SECRET_KEY), the full .git history, the dev SQLite database
      # under data/, and scripts/ read-only inside the container.
      - ./content:/content/wiki:ro

  # Daily SQLite backups (docs/operations.md, section "Backups"). Same image and
  # same data volume as the portal; the volume is mounted read-only because the
  # command only reads the live database. Copies land in ./backups on the host
  # so they survive the loss of the portal-data volume. The first backup runs at
  # start, then one every 24 hours; a failed run is retried after an hour.
  backup:
    image: rogue-trader-portal
    restart: unless-stopped
    # Container hardening: no privilege gain, no Linux capabilities (the backup
    # job needs none), and a read-only root filesystem. The
    # only writable places are the mounted volumes and a tmpfs /tmp (scratch space).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Settings loading needs the same three variables as the portal; the
    # secret key is used for nothing else here.
    environment:
      DATABASE_PATH: /data/db.sqlite3
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
    volumes:
      - portal-data:/data:ro
      - ./backups:/backups
    # The image's own healthcheck probes gunicorn, which this service does
    # not run. Healthy here means: a backup newer than 26 hours exists.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import glob, os, sys, time; f = glob.glob('/backups/db-*.sqlite3'); sys.exit(0 if f and time.time() - max(map(os.path.getmtime, f)) < 26 * 3600 else 1)"
      interval: 30m
      timeout: 10s
      start_period: 5m
      start_interval: 10s
      retries: 1
    command:
      - sh
      - -c
      - |
        # PID 1 is this shell: without a handler SIGTERM is ignored and
        # "docker stop" waits ten seconds before killing it. Sleeping in the
        # background and waiting on it lets the trap run at once; a running
        # backup finishes first, so a stop never leaves a half-written copy.
        trap 'exit 0' TERM INT
        while true; do
          if python manage.py backup_db; then
            sleep 86400 & wait $$!
          else
            echo "backup_db FAILED - retrying in one hour" >&2
            sleep 3600 & wait $$!
          fi
        done

volumes:
  portal-data:
